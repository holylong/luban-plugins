name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Every file is hashed, every entry validated: a stale plugins.json would
      # make clients fail their sha256 check, so CI refuses to merge one.
      - run: node scripts/build-index.mjs --check
